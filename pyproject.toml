[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polish"
version = "0.1.0"
description = "Autonomous night-shift refactoring agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yash Chanchani" }]
dependencies = [
    # gitignore matching, wildmatch-compatible with git's own semantics
    "pathspec>=1.0",
    # Tier 0's codemods: edits that come back with comments and layout intact
    "libcst>=1.4",
    # Tier 0's type check, and the gate that catches cross-file breakage.
    # See docs/adr/0004-mypy-as-the-tier-0-type-check.md.
    "mypy>=1.11",
    # Tier 1's edit engine (SPEC §3.2): Claude Code as a library. Imported
    # lazily by polish.tier1._claude, so a machine without Node, a `claude`
    # binary or credentials declines Tier 1 rather than failing to import —
    # `polish scan` on such a machine has to keep working.
    "claude-agent-sdk>=0.1",
]

[project.scripts]
polish = "polish.cli:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/polish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `conftest` and `corpus_support` are test-suite modules reached via pytest's
# rootdir, not installed packages, so ruff needs telling that they are ours.
known-first-party = ["polish", "conftest", "corpus_support", "probe_corpus_support"]
